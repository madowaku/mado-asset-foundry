name: Bootstrap pinned M1.2 screenshot goldens

# One-time, tightly scoped adoption of the seven PNGs from a known-good
# green M1.2 Chromium job. No general golden auto-acceptance or update path.
on:
  push:
    branches: [feat/maf-m1-2-1-golden-visual-delta]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  import-approved-source:
    if: github.ref == 'refs/heads/feat/maf-m1-2-1-golden-visual-delta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow for strict source verification
        run: python -m pip install "Pillow>=11,<13"
      - name: Retrieve fixed green Chromium M1.2 artifact (run 38016104787)
        uses: actions/download-artifact@v4
        with:
          name: maf-m1-2-chromium-visual-evidence
          repository: madowaku/mado-asset-foundry
          run-id: 38016104787
          github-token: ${{ github.token }}
          path: runs/fixed-m1-2-source
      - name: Verify every PNG SHA-256 and import only if absent
        run: python scripts/import_golden_artifact.py --source runs/fixed-m1-2-source
      - name: Commit immutable reference PNGs to this feature branch
        shell: bash
        run: |
          git add e2e/goldens/*.png
          if git diff --cached --quiet; then
            echo "All goldens are present and locked, no automatic updates."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test(maf): lock M1.2 known-good Chromium screenshot goldens"
            git push origin HEAD:feat/maf-m1-2-1-golden-visual-delta
          fi
