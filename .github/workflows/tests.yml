name: Python tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  full-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Full test suite including Windows-only Effekseer checks
        run: pytest -q

  asset-intake-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Cross-platform M0.9-M0.9.4 contract tests
        run: pytest -q tests/test_asset_sources.py tests/test_attribution_bridge.py tests/test_runtime_import_qa.py tests/test_visual_gallery.py tests/test_asset_flow.py


  real-godot-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Godot 4.6.1 on the CI runner
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: false
      - name: Verify real Godot headless resource import
        run: pytest -q tests/test_runtime_import_qa_real_godot.py

  real-gallery-linux:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Install Godot 4.6.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: false
      - name: Install Xvfb virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Capture rendered gallery with real Godot
        run: pytest -q tests/test_visual_gallery_real_godot.py tests/test_asset_flow_real_godot.py
      - name: Preserve original synthetic flow preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maf-m0-9-integrated-gallery
          path: runs/ci-asset-flow/
          if-no-files-found: warn
          retention-days: 7
