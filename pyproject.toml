[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mado-asset-foundry"
version = "0.9.2"
description = "Game asset manufacturing pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=2",
  "Pillow>=11,<13",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
maf = "mado_asset_foundry.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mado_asset_foundry"]
