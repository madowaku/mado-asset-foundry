[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mado-asset-foundry"
version = "0.1.0"
description = "Game asset manufacturing pipeline"
requires-python = ">=3.11"
dependencies = [
  "openai>=2",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
maf = "mado_asset_foundry.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
