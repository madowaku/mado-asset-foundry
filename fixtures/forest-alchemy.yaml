schema_version: "0.1"
id: forest-alchemy-icons-v1
name: Forest Alchemy Icons
asset_type: icon
theme: forest_alchemy
style: polished_pixel_art
subjects:
  - red healing potion
  - blue mana potion
  - glowing forest mushroom
  - bundled medicinal herbs
  - brass alchemy mortar and pestle
  - corked reagent bottle
prompt_extra: Keep the object charming but production-friendly; avoid tiny decorative noise.

output:
  width: 32
  height: 32
  format: png
  transparent: true

generation:
  provider: openai-image
  model: gpt-image-2.5-flare
  candidate_count: 96
  batch_size: 4
  render_size: 1024x1024
  quality: low
  background: transparent
  output_format: png

targets:
  - generic
  - godot
  - unity

curation:
  target_count: 32
  criteria:
    - readability
    - silhouette
    - style_consistency
    - uniqueness

refinement:
  alpha_threshold: 8
  padding: 2
  palette_colors: 16
  resample: lanczos
  dither: false

product:
  product_id: forest-alchemy-icons
  version: 0.1.0
  title: Forest Alchemy Icons
  author: madowaku
  short_description: A compact dogfood pack of transparent 32x32 forest alchemy game icons.
  license_id: MADO-DOGFOOD-DRAFT
  license_status: draft
  license_text: |
    MADO Dogfood Draft License v0.1

    This fixture license is for internal evaluation and packaging tests only.
    It is not a public distribution license. Replace this text before publishing
    or selling the product.
  ai_assisted: true
  ai_disclosure: AI-assisted source images are human-curated, QA-checked, normalized, and packaged by MADO Asset Foundry.
  sheet_columns: 8
  preview_scale: 4

itch:
  visibility: draft
  classification: assets
  upload_type: graphical_assets
  tags:
    - pixel-art
    - 2d
    - fantasy
    - rpg
    - icons
  ai_content_types:
    - graphics
  pricing_mode: manual_review
